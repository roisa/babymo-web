name: Deploy to gh-pages

# Pushes the Next.js static export to the gh-pages branch on every push to
# main. GitHub Pages serves directly from that branch (Settings → Pages →
# Deploy from a branch → gh-pages → / (root)).
#
# Kept deliberately minimal: only first-party actions, only contents:write,
# no environments, no concurrency group. Each push to main rebuilds and
# force-pushes to gh-pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install OG image tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin imagemagick

      - run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://babymo.id
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run build

      - name: Stamp .nojekyll + CNAME on output
        run: |
          touch out/.nojekyll
          echo "babymo.id" > out/CNAME

      - name: Force-push out/ to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy $SHA"
          git push --force --quiet "https://x-access-token:${TOKEN}@github.com/${REPO}" gh-pages
