<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#338A2E">
<title>Halaman tidak ditemukan — Baby Mo</title>
<link rel="icon" href="/assets/favicon.ico">
<link rel="canonical" href="https://babymo.id/404.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Nunito',sans-serif;
    background:linear-gradient(155deg,#1b5e14 0%,#2e8a25 45%,#3daa31 75%,#52c23c 100%);
    color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
  }
  .wrap{max-width:520px}
  .mo{width:180px;height:auto;filter:drop-shadow(0 18px 32px rgba(0,0,0,.25));margin-bottom:18px;animation:float 4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}
  h1{font-family:'Fredoka One',cursive;font-size:clamp(40px,8vw,72px);margin-bottom:6px;color:#FFD93D;text-shadow:0 4px 16px rgba(0,0,0,.25)}
  h2{font-family:'Fredoka One',cursive;font-size:clamp(20px,3vw,28px);margin-bottom:14px}
  p{font-size:15px;color:rgba(255,255,255,.86);line-height:1.65;margin-bottom:28px}
  .btn{display:inline-flex;align-items:center;gap:8px;background:#FFD93D;color:#1A2E1A;font-weight:800;text-decoration:none;border-radius:99px;padding:13px 26px;box-shadow:0 8px 22px rgba(255,217,61,.45);transition:transform .2s}
  .btn:hover{transform:translateY(-3px) scale(1.03)}
  .arabic{font-family:serif;font-size:18px;color:rgba(255,255,255,.7);margin-top:24px;letter-spacing:.5px}
</style>
</head>
<body>
  <div class="wrap">
    <picture>
      <source srcset="/assets/baby-mo-hero.webp" type="image/webp">
      <img class="mo" src="/assets/baby-mo-hero.png" alt="Baby Mo" width="900" height="900" decoding="async">
    </picture>
    <h1>404</h1>
    <h2>Halaman tidak ditemukan 🌙</h2>
    <p>Maaf, halaman yang kamu cari tidak ada. Yuk kembali ke beranda dan main bareng Baby Mo!</p>
    <a href="/" class="btn">🏠 Kembali ke Beranda</a>
    <div class="arabic">بِسْمِ اللَّهِ</div>
  </div>
</body>
</html>
